; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_matrixportal_esp32s3]
; Pinned so CI builds what dev.sh builds: Arduino core 2.0.17 (ESP-IDF 4.4), which
; the pinned Protomatter below targets. Unpinned, CI picked up 8.x (core 3.x) and failed.
platform = espressif32@6.10.0
board = adafruit_matrixportal_esp32s3
framework = arduino
upload_speed = 921600
monitor_speed = 115200

lib_deps =
  https://github.com/ropg/ezTime.git
  https://github.com/adafruit/Adafruit_Protomatter#d55e3bf83306b19651c1905bfb984f3768c2569e
  https://github.com/adafruit/Adafruit_SPIFlash
  https://github.com/adafruit/SdFat
  https://github.com/adafruit/Adafruit_ImageReader
  knolleary/PubSubClient@^2.8
  

extra_scripts = post:scripts/version.py
